[project]
name = "im-doing"
version = "0.1.0"
description = "A tiny daily work notes site"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "markdown-it-py>=3,<5",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
]

[tool.uv]
package = false
