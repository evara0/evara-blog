{% if articles %}
<div class="article-list">
  {% for article in articles %}
  <article class="article-row">
    <time datetime="{{ article.date.isoformat() }}">{{ article.date.isoformat() }}</time>
    <div><h2><a href="/articles/{{ article.slug }}">{{ article.title }}</a></h2>
      <p>{{ article.summary }}</p>
      {% if article.tags %}<ul class="article-tags" aria-label="标签">{% for tag in article.tags %}<li>{{ tag }}</li>{% endfor %}</ul>{% endif %}
    </div>
  </article>
  {% endfor %}
</div>
{% else %}<p class="empty-message">暂无文章，敬请期待。</p>{% endif %}
