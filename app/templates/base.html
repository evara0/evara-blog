<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{% block title %}EVARA'S BLOG{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body><div class="shell">
  <header class="blog-header">
    <a class="site-brand" href="/"><span class="brand-mark" aria-hidden="true">//</span><span>EVARA'S BLOG</span></a>
    <nav class="site-nav" aria-label="主导航">
      <a href="/"{% if current == 'home' %} aria-current="page"{% endif %}>首页</a>
      <a href="/articles"{% if current == 'articles' %} aria-current="page"{% endif %}>文章</a>
      <a href="/now">正在做</a><a href="/me">个人</a>
    </nav>
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  {% if signature %}<footer class="site-footer"><p class="site-signature">{{ signature }}</p></footer>{% endif %}
</div></body></html>
